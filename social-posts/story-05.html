<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>story-05 · A Judge You Can Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:608px;height:1080px;overflow:hidden}
  body{
    position:relative; background:var(--parchment-2);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    padding:22px;
  }
  .frame{
    width:100%; height:100%; border:1px solid var(--gold); position:relative;
  }
  .frame::before{content:""; position:absolute; inset:5px; border:1px solid var(--gold)}
  .canvas{
    position:absolute; inset:6px; padding:116px 46px 118px;
    display:flex; flex-direction:column; justify-content:space-between;
    align-items:center; text-align:center;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:center; gap:7px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:29px;
    letter-spacing:5px; color:var(--navy);
  }
  .logo-rule{width:82px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:11px; letter-spacing:3px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .head{display:flex; flex-direction:column; align-items:center}
  .eyebrow{
    font-weight:700; font-size:14px; letter-spacing:4px;
    text-transform:uppercase; color:var(--burgundy); margin-bottom:22px;
  }
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:72px; line-height:1.06; letter-spacing:-1px;
    color:var(--navy); max-width:460px;
  }
  .headline .accent{font-style:italic; font-weight:500; color:var(--burgundy)}
  .divider{width:44px; height:1px; background:var(--gold); margin-top:30px}
  .subhead{
    font-family:var(--font-display);
    font-size:24px; line-height:1.5; color:var(--ink-soft); max-width:420px;
  }
  .pillars{width:100%; display:flex; flex-direction:column}
  .pillar{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:14px 0; border-top:1px dotted var(--parchment-3);
  }
  .pillar:last-child{border-bottom:1px dotted var(--parchment-3)}
  .pillar-n{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:20px; color:var(--gold-muted);
  }
  .pillar-t{
    font-weight:700; font-size:14px; letter-spacing:3px;
    text-transform:uppercase; color:var(--ink);
  }
  .body{
    font-weight:600; font-size:13px; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .cta{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--navy); color:var(--parchment);
    padding:20px 40px; border-radius:4px;
    font-weight:700; font-size:14px; letter-spacing:3px; text-transform:uppercase;
  }
</style>
</head>
<body class="post">
  <div class="frame">
    <div class="canvas">
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
      <div class="head">
        <div class="eyebrow">Morse For Idaho</div>
        <h1 class="headline">A Judge You <span class="accent">Can Trust.</span></h1>
        <div class="divider" aria-hidden="true"></div>
      </div>
      <p class="subhead">Experienced federal and state prosecutor committed to fairness, integrity, and the rule of law.</p>
      <div class="pillars">
        <div class="pillar"><span class="pillar-n">i.</span><span class="pillar-t">Experienced</span></div>
        <div class="pillar"><span class="pillar-n">ii.</span><span class="pillar-t">Ethical</span></div>
        <div class="pillar"><span class="pillar-n">iii.</span><span class="pillar-t">Fair</span></div>
      </div>
      <p class="body">Ada · Boise · Elmore · Valley</p>
      <span class="cta">Join the Campaign <span aria-hidden="true">&rarr;</span></span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

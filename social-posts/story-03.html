<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>story-03 · Service Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:608px;height:1080px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(175deg,var(--burgundy) 0%,var(--burgundy-deep) 100%);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .hairline-l{position:absolute; top:40px; bottom:40px; left:32px; width:1px; background:rgba(216,184,104,0.35)}
  .hairline-r{position:absolute; top:40px; bottom:40px; right:32px; width:1px; background:rgba(216,184,104,0.35)}
  .canvas{
    position:relative; width:608px; height:1080px;
    padding:144px 64px 146px; display:flex; flex-direction:column;
    justify-content:space-between; align-items:center; text-align:center;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:center; gap:7px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:29px;
    letter-spacing:5px; color:var(--gold);
  }
  .logo-rule{width:82px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:11px; letter-spacing:3px;
    text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .stat{display:flex; flex-direction:column; align-items:center}
  .eyebrow{
    font-weight:700; font-size:14px; letter-spacing:4px;
    text-transform:uppercase; color:var(--gold); margin-bottom:4px;
  }
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:230px; line-height:1; letter-spacing:-5px; color:var(--parchment);
  }
  .subhead{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:30px; color:var(--gold); margin-top:4px;
  }
  .body{
    font-size:17px; line-height:1.65; color:rgba(250,248,242,0.72); max-width:420px;
  }
  .ministats{
    width:100%; display:flex;
    border-top:1px solid rgba(216,184,104,0.3);
    border-bottom:1px solid rgba(216,184,104,0.3);
  }
  .ministat{flex:1; padding:20px 8px; display:flex; flex-direction:column; gap:4px}
  .ministat + .ministat{border-left:1px solid rgba(216,184,104,0.3)}
  .ministat-n{
    font-family:var(--font-display); font-weight:700;
    font-size:38px; color:var(--parchment);
  }
  .ministat-l{
    font-weight:700; font-size:10px; letter-spacing:2px;
    text-transform:uppercase; color:rgba(250,248,242,0.5);
  }
  .footer{display:flex; flex-direction:column; align-items:center; gap:14px}
  .cta{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--gold); color:var(--navy);
    padding:20px 44px; border-radius:4px;
    font-weight:700; font-size:15px; letter-spacing:3px; text-transform:uppercase;
  }
  .meta{
    font-weight:600; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; color:rgba(250,248,242,0.45);
  }
</style>
</head>
<body class="post">
  <div class="hairline-l" aria-hidden="true"></div>
  <div class="hairline-r" aria-hidden="true"></div>
  <div class="canvas">
    <div class="logo-slot">
      <div class="logo-name">MORSE</div>
      <div class="logo-rule"></div>
      <div class="logo-office">For Fourth District Judge</div>
    </div>
    <div class="stat">
      <div class="eyebrow">Service · By the Numbers</div>
      <div class="headline">15+</div>
      <div class="subhead">years of public service</div>
    </div>
    <p class="body">The same standard for public officials and private citizens. No one is above the law.</p>
    <div class="ministats">
      <div class="ministat">
        <span class="ministat-n">10+</span>
        <span class="ministat-l">Years Legal Experience</span>
      </div>
      <div class="ministat">
        <span class="ministat-n">1,000+</span>
        <span class="ministat-l">Courtroom Appearances</span>
      </div>
    </div>
    <div class="footer">
      <span class="cta">Donate <span aria-hidden="true">&rarr;</span></span>
      <span class="meta">Paid for by Morse For Idaho</span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-05 · Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:1080px;height:1080px;overflow:hidden}
  body{
    position:relative; background:var(--navy-deep);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .bleed{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .watermark{
    position:absolute; left:-70px; bottom:-190px;
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:640px; line-height:1; color:rgba(216,184,104,0.07);
    user-select:none; pointer-events:none;
  }
  .canvas{
    position:relative; width:1080px; height:1080px;
    padding:88px 96px; display:flex; flex-direction:column;
  }
  .top{display:flex; justify-content:space-between; align-items:flex-start}
  .logo-slot{display:flex; flex-direction:column; gap:9px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:42px;
    letter-spacing:7px; color:var(--gold);
  }
  .logo-rule{width:118px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:15px; letter-spacing:4px;
    text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .eyebrow{
    display:flex; align-items:center; gap:18px; margin-top:10px;
    font-weight:700; font-size:21px; letter-spacing:5px;
    text-transform:uppercase; color:var(--gold);
  }
  .eyebrow::before{content:""; width:50px; height:1px; background:var(--gold)}
  .stage{flex:1; display:flex; align-items:center; gap:64px}
  .date-tile{
    flex-shrink:0; width:280px; background:var(--parchment);
    border-radius:14px; padding:46px 20px; text-align:center;
  }
  .date-month{
    font-weight:700; font-size:26px; letter-spacing:6px;
    text-transform:uppercase; color:var(--burgundy);
  }
  .date-day{
    font-family:var(--font-display); font-weight:700;
    font-size:150px; line-height:1.05; color:var(--navy);
  }
  .date-year{
    font-weight:600; font-size:22px; letter-spacing:4px; color:var(--ink-muted);
  }
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:88px; line-height:1.06; letter-spacing:-1px; color:var(--parchment);
  }
  .headline .accent{font-style:italic; font-weight:500; color:var(--gold)}
  .subhead{
    margin-top:30px; font-size:28px; line-height:1.55;
    color:rgba(250,248,242,0.7); max-width:560px;
  }
  .body{
    margin-top:26px; font-weight:700; font-size:21px; letter-spacing:3px;
    text-transform:uppercase; color:var(--gold);
  }
  .footer{display:flex; align-items:center; justify-content:space-between}
  .cta{
    display:inline-flex; align-items:center; gap:18px;
    background:var(--burgundy); color:var(--parchment);
    padding:30px 60px; border-radius:4px;
    font-weight:700; font-size:24px; letter-spacing:4px; text-transform:uppercase;
  }
  .meta{
    font-weight:600; font-size:19px; letter-spacing:3px;
    text-transform:uppercase; color:rgba(250,248,242,0.45);
  }
</style>
</head>
<body class="post">
  <div class="bleed" aria-hidden="true"><div class="watermark">V</div></div>
  <div class="canvas">
    <div class="top">
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
      <div class="eyebrow">The Docket</div>
    </div>
    <div class="stage">
      <div class="date-tile">
        <div class="date-month">May</div>
        <div class="date-day">19</div>
        <div class="date-year">2026</div>
      </div>
      <div>
        <h1 class="headline">On the road <span class="accent">to May 19.</span></h1>
        <p class="subhead">Courthouse steps, kitchen tables, veteran halls — every stop between now and election day.</p>
        <p class="body">Free · Open to every registered voter</p>
      </div>
    </div>
    <div class="footer">
      <span class="cta">See the Full Docket <span aria-hidden="true">&rarr;</span></span>
      <span class="meta">Paid for by Morse For Idaho</span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

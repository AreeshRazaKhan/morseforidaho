<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-03 · Stat Callout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:1080px;height:1080px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(170deg,var(--burgundy) 0%,var(--burgundy-deep) 100%);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .hairline-top{position:absolute; top:64px; left:96px; right:96px; height:1px; background:rgba(216,184,104,0.4)}
  .hairline-bottom{position:absolute; bottom:64px; left:96px; right:96px; height:1px; background:rgba(216,184,104,0.4)}
  .canvas{
    position:relative; width:1080px; height:1080px;
    padding:120px 96px; display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:center; gap:9px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:40px;
    letter-spacing:7px; color:var(--gold);
  }
  .logo-rule{width:112px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:15px; letter-spacing:4px;
    text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center}
  .eyebrow{
    font-weight:700; font-size:23px; letter-spacing:6px;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:250px; line-height:1; letter-spacing:-4px; color:var(--parchment);
  }
  .subhead{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:44px; color:var(--gold); margin-top:6px;
  }
  .body{
    margin-top:30px; font-size:25px; line-height:1.65;
    color:rgba(250,248,242,0.72); max-width:640px;
  }
  .cta{
    display:inline-flex; align-items:center; gap:18px;
    background:var(--gold); color:var(--navy);
    padding:30px 64px; border-radius:4px;
    font-weight:700; font-size:25px; letter-spacing:4px; text-transform:uppercase;
  }
  .paidfor{
    margin-top:24px; font-weight:600; font-size:16px; letter-spacing:3px;
    text-transform:uppercase; color:rgba(250,248,242,0.45);
  }
</style>
</head>
<body class="post">
  <div class="hairline-top" aria-hidden="true"></div>
  <div class="hairline-bottom" aria-hidden="true"></div>
  <div class="canvas">
    <div class="logo-slot">
      <div class="logo-name">MORSE</div>
      <div class="logo-rule"></div>
      <div class="logo-office">For Fourth District Judge</div>
    </div>
    <div class="stage">
      <div class="eyebrow">The Record · By the Numbers</div>
      <div class="headline">1,000+</div>
      <div class="subhead">courtroom appearances across Idaho</div>
      <p class="body">David has spent his career in trial and appellate courts, prosecuting serious crimes and handling complex legal questions.</p>
    </div>
    <span class="cta">Donate <span aria-hidden="true">&rarr;</span></span>
    <span class="paidfor">Paid for by Morse For Idaho</span>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

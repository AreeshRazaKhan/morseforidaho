<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-08 · Hook + CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:1080px;height:1080px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(150deg,var(--burgundy-deep) 0%,var(--burgundy) 60%,var(--burgundy-light) 130%);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .bleed{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .watermark{
    position:absolute; right:-140px; top:-130px;
    font-family:var(--font-display); font-weight:800;
    font-size:660px; line-height:1; color:rgba(216,184,104,0.08);
    user-select:none; pointer-events:none;
  }
  .canvas{
    position:relative; width:1080px; height:1080px;
    padding:96px; display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:center; gap:9px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:40px;
    letter-spacing:7px; color:var(--gold);
  }
  .logo-rule{width:112px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:15px; letter-spacing:4px;
    text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center}
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:112px; line-height:1.05; letter-spacing:-2px;
    color:var(--parchment); max-width:860px;
  }
  .headline .accent{font-style:italic; font-weight:500; color:var(--gold)}
  .subhead{
    margin-top:40px; font-size:29px; line-height:1.6;
    color:rgba(250,248,242,0.75); max-width:680px;
  }
  .cta-group{display:flex; flex-direction:column; align-items:center; gap:26px}
  .cta{
    display:inline-flex; align-items:center; gap:18px;
    background:var(--navy-deep); color:var(--parchment);
    padding:32px 70px; border-radius:4px;
    font-weight:700; font-size:26px; letter-spacing:4px; text-transform:uppercase;
  }
  .meta{
    font-weight:600; font-size:18px; letter-spacing:3px;
    text-transform:uppercase; color:rgba(250,248,242,0.45);
  }
</style>
</head>
<body class="post">
  <div class="bleed" aria-hidden="true"><div class="watermark">M</div></div>
  <div class="canvas">
    <div class="logo-slot">
      <div class="logo-name">MORSE</div>
      <div class="logo-rule"></div>
      <div class="logo-office">For Fourth District Judge</div>
    </div>
    <div class="stage">
      <h1 class="headline">What does a Fourth District <span class="accent">judge do?</span></h1>
      <p class="subhead">District judges hear felony criminal cases, civil disputes, and appeals from magistrate courts — decisions that shape everyday life across the district.</p>
    </div>
    <div class="cta-group">
      <span class="cta">Ask a Question <span aria-hidden="true">&rarr;</span></span>
      <span class="meta">Ask Morse · Every question is read</span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-04 · Announcement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:1080px;height:1080px;overflow:hidden}
  body{
    position:relative; background:var(--parchment-2);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    padding:64px;
  }
  .frame{
    width:100%; height:100%;
    border:1px solid var(--gold); position:relative;
  }
  .frame::before{
    content:""; position:absolute; inset:5px;
    border:1px solid var(--gold);
  }
  .canvas{
    position:absolute; inset:6px;
    padding:84px 90px; display:flex; flex-direction:column;
    align-items:center; text-align:center;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:center; gap:9px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:42px;
    letter-spacing:7px; color:var(--navy);
  }
  .logo-rule{width:118px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:15px; letter-spacing:4px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center}
  .eyebrow{
    font-weight:700; font-size:22px; letter-spacing:6px;
    text-transform:uppercase; color:var(--burgundy); margin-bottom:34px;
  }
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:96px; line-height:1.06; letter-spacing:-1px;
    color:var(--navy); max-width:780px;
  }
  .headline .accent{font-style:italic; font-weight:500; color:var(--burgundy)}
  .divider{width:60px; height:1px; background:var(--gold); margin:40px auto 0}
  .subhead{
    margin-top:38px; font-family:var(--font-display);
    font-size:34px; color:var(--ink-soft);
  }
  .body{
    margin-top:14px; font-weight:600; font-size:20px; letter-spacing:3px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .cta{
    display:inline-flex; align-items:center; gap:16px;
    background:var(--navy); color:var(--parchment);
    padding:28px 56px; border-radius:4px;
    font-weight:700; font-size:23px; letter-spacing:4px; text-transform:uppercase;
  }
</style>
</head>
<body class="post">
  <div class="frame">
    <div class="canvas">
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
      <div class="stage">
        <div class="eyebrow">Election Day</div>
        <h1 class="headline">Vote <span class="accent">Morse.</span><br>May 19, 2026</h1>
        <div class="divider" aria-hidden="true"></div>
        <p class="subhead">Every registered Idaho voter can vote for David.</p>
        <p class="body">Nonpartisan · Fourth Judicial District</p>
      </div>
      <span class="cta">Pledge Your Vote <span aria-hidden="true">&rarr;</span></span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

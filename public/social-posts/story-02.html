<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>story-02 · Endorsement Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:608px;height:1080px;overflow:hidden}
  body{
    position:relative; background:var(--parchment);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .bleed{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .watermark{
    position:absolute; top:-60px; left:10px;
    font-family:var(--font-display); font-weight:700;
    font-size:460px; line-height:1; color:var(--parchment-3);
  }
  .band{
    position:absolute; left:0; right:0; bottom:0; height:96px;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .band-text{
    font-family:var(--font-body); font-weight:600; font-size:11px;
    letter-spacing:2.5px; text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .canvas{
    position:relative; width:608px; height:1080px;
    padding:144px 52px 146px; display:flex; flex-direction:column;
  }
  .eyebrow{
    align-self:flex-end; display:flex; align-items:center; gap:12px;
    font-weight:700; font-size:14px; letter-spacing:4px;
    text-transform:uppercase; color:var(--burgundy);
  }
  .eyebrow::after{content:""; width:36px; height:1px; background:var(--burgundy)}
  .stage{flex:1; display:flex; align-items:center}
  .quote{border-left:3px solid var(--gold); padding-left:30px}
  .headline{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:44px; line-height:1.3; color:var(--burgundy); max-width:470px;
  }
  .subhead{
    margin-top:30px; font-weight:700; font-size:17px; letter-spacing:3px;
    text-transform:uppercase; color:var(--ink);
  }
  .body{
    margin-top:8px; font-weight:600; font-size:13px; letter-spacing:2px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .divider{width:100%; height:1px; background:var(--parchment-3); margin-bottom:30px}
  .footer{display:flex; align-items:center; justify-content:space-between}
  .logo-slot{display:flex; flex-direction:column; gap:6px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:27px;
    letter-spacing:5px; color:var(--navy);
  }
  .logo-rule{width:78px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:10px; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .cta{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--burgundy); color:var(--parchment);
    padding:18px 28px; border-radius:4px;
    font-weight:700; font-size:13px; letter-spacing:2px; text-transform:uppercase;
  }
</style>
</head>
<body class="post">
  <div class="bleed" aria-hidden="true"><div class="watermark">&ldquo;</div></div>
  <div class="band">
    <span class="band-text">Paid for by Morse For Idaho</span>
  </div>
  <div class="canvas">
    <div class="eyebrow">Endorsements · II</div>
    <div class="stage">
      <blockquote class="quote">
        <p class="headline">&ldquo;David understands Idaho values. His commitment to fairness and the rule of law is exactly what the Fourth District needs.&rdquo;</p>
        <p class="subhead">Wendy Olson</p>
        <p class="body">Former U.S. Attorney for Idaho</p>
      </blockquote>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="footer">
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
      <span class="cta">Join the Campaign <span aria-hidden="true">&rarr;</span></span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

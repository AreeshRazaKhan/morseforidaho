<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>story-07 · Testimonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:608px;height:1080px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(170deg,var(--navy) 0%,var(--navy-ink) 100%);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .canvas{
    position:relative; width:608px; height:1080px;
    padding:144px 56px 146px; display:flex; flex-direction:column;
    justify-content:space-between; align-items:center; text-align:center;
  }
  .portrait{
    width:120px; height:120px; border-radius:50%;
    background:var(--parchment-2);
    display:flex; align-items:center; justify-content:center;
    outline:1px solid var(--gold); outline-offset:8px;
  }
  .portrait span{
    font-family:var(--font-display); font-weight:700;
    font-size:42px; color:var(--navy);
  }
  .stage{display:flex; flex-direction:column; align-items:center}
  .headline{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:33px; line-height:1.42; color:var(--parchment); max-width:480px;
  }
  .headline .first{color:var(--gold)}
  .subhead{
    margin-top:30px; font-weight:700; font-size:17px; letter-spacing:3px;
    text-transform:uppercase; color:var(--gold);
  }
  .body{
    margin-top:8px; font-weight:600; font-size:12px; letter-spacing:2px;
    text-transform:uppercase; color:rgba(250,248,242,0.5);
  }
  .footer{
    width:100%; display:flex; align-items:flex-end; justify-content:space-between;
    border-top:1px solid rgba(216,184,104,0.3); padding-top:26px;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:flex-start; gap:6px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:26px;
    letter-spacing:4px; color:var(--gold);
  }
  .logo-rule{width:72px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:9px; letter-spacing:2px;
    text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .cta{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--burgundy); color:var(--parchment);
    padding:18px 28px; border-radius:4px;
    font-weight:700; font-size:13px; letter-spacing:2px; text-transform:uppercase;
  }
</style>
</head>
<body class="post">
  <div class="canvas">
    <div class="portrait" aria-hidden="true"><span>AH</span></div>
    <div class="stage">
      <blockquote class="headline"><span class="first">&ldquo;I&rsquo;ve had the opportunity to work on the other side of some of the most serious cases with David Morse.</span> He&rsquo;s always been professional, honest, and plays by the rules. He&rsquo;d be a great judge.&rdquo;</blockquote>
      <p class="subhead">Aaron Hooper</p>
      <p class="body">Partner · Hooper Mitchell &amp; Associates</p>
    </div>
    <div class="footer">
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
      <span class="cta">Meet David <span aria-hidden="true">&rarr;</span></span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

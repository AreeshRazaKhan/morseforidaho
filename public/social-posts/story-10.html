<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>story-10 · Write to David</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:608px;height:1080px;overflow:hidden}
  body{
    position:relative; display:flex; flex-direction:column;
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .top{
    position:relative; height:560px; background:var(--navy);
    border-bottom:1px solid var(--gold); overflow:hidden;
    padding:142px 52px 40px; display:flex; flex-direction:column;
    justify-content:space-between;
  }
  .watermark{
    position:absolute; right:-50px; top:-70px;
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:360px; line-height:1; color:rgba(216,184,104,0.07);
  }
  .logo-slot{position:relative; display:flex; flex-direction:column; gap:7px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:29px;
    letter-spacing:5px; color:var(--gold);
  }
  .logo-rule{width:82px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:11px; letter-spacing:3px;
    text-transform:uppercase; color:rgba(250,248,242,0.6);
  }
  .stage{position:relative}
  .eyebrow{
    display:flex; align-items:center; gap:12px;
    font-weight:700; font-size:13px; letter-spacing:3px;
    text-transform:uppercase; color:var(--gold); margin-bottom:20px;
  }
  .eyebrow::before{content:""; width:34px; height:1px; background:var(--gold)}
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:74px; line-height:1.03; letter-spacing:-1px; color:var(--parchment);
  }
  .headline .accent{font-style:italic; font-weight:500; color:var(--gold)}
  .subhead{
    margin-top:20px; font-size:18px; line-height:1.6;
    color:rgba(250,248,242,0.72); max-width:430px;
  }
  .bottom{
    flex:1; background:var(--parchment);
    padding:48px 52px 146px; display:flex; flex-direction:column;
    justify-content:space-between;
  }
  .checklist{display:flex; flex-direction:column; gap:22px}
  .check{display:flex; align-items:center; gap:18px}
  .check-mark{
    flex-shrink:0; width:36px; height:36px; border:1px solid var(--gold-muted);
    border-radius:4px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-style:italic; font-weight:600;
    font-size:18px; color:var(--burgundy);
  }
  .check-text{
    font-family:var(--font-display); font-weight:600;
    font-size:25px; color:var(--ink);
  }
  .note{
    font-weight:600; font-size:12px; letter-spacing:2px;
    text-transform:uppercase; color:var(--ink-muted);
    padding-top:20px; border-top:1px dotted var(--parchment-3);
  }
  .footer{display:flex; align-items:center; justify-content:space-between}
  .cta{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--burgundy); color:var(--parchment);
    padding:20px 36px; border-radius:4px;
    font-weight:700; font-size:14px; letter-spacing:3px; text-transform:uppercase;
  }
  .meta{
    font-weight:600; font-size:10px; letter-spacing:2px;
    text-transform:uppercase; color:var(--ink-muted);
  }
</style>
</head>
<body class="post">
  <div class="top">
    <div class="watermark" aria-hidden="true">X</div>
    <div class="logo-slot">
      <div class="logo-name">MORSE</div>
      <div class="logo-rule"></div>
      <div class="logo-office">For Fourth District Judge</div>
    </div>
    <div class="stage">
      <div class="eyebrow">The Campaign</div>
      <h1 class="headline">Write to <span class="accent">David.</span></h1>
      <p class="subhead">Every message is read. Every voice matters to the campaign.</p>
    </div>
  </div>
  <div class="bottom">
    <div class="checklist">
      <div class="check">
        <span class="check-mark" aria-hidden="true">i</span>
        <span class="check-text">(208) 615-5086</span>
      </div>
      <div class="check">
        <span class="check-mark" aria-hidden="true">ii</span>
        <span class="check-text">david@morseforidaho.com</span>
      </div>
      <div class="check">
        <span class="check-mark" aria-hidden="true">iii</span>
        <span class="check-text">P.O. Box 171101 · Boise, ID</span>
      </div>
    </div>
    <div class="note">Replies within 48 hours · Two business days</div>
    <div class="footer">
      <span class="cta">Contact Us <span aria-hidden="true">&rarr;</span></span>
      <span class="meta">Paid for by Morse For Idaho</span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-07 · Testimonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:1080px;height:1080px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(165deg,var(--navy) 0%,var(--navy-ink) 100%);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .canvas{
    position:relative; width:1080px; height:1080px;
    padding:96px 100px; display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .portrait{
    width:160px; height:160px; border-radius:50%;
    background:var(--parchment-2);
    display:flex; align-items:center; justify-content:center;
    outline:1px solid var(--gold); outline-offset:10px;
  }
  .portrait span{
    font-family:var(--font-display); font-weight:700;
    font-size:58px; color:var(--navy);
  }
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center}
  .headline{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:50px; line-height:1.32; color:var(--parchment); max-width:830px;
  }
  .headline .first{color:var(--gold)}
  .subhead{
    margin-top:46px; font-weight:700; font-size:26px; letter-spacing:5px;
    text-transform:uppercase; color:var(--gold);
  }
  .body{
    margin-top:12px; font-weight:600; font-size:19px; letter-spacing:3px;
    text-transform:uppercase; color:rgba(250,248,242,0.5);
  }
  .footer{
    width:100%; display:flex; align-items:flex-end; justify-content:space-between;
    border-top:1px solid rgba(216,184,104,0.3); padding-top:42px;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:flex-start; gap:9px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:40px;
    letter-spacing:7px; color:var(--gold);
  }
  .logo-rule{width:112px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:14px; letter-spacing:4px;
    text-transform:uppercase; color:rgba(250,248,242,0.55);
  }
  .cta{
    display:inline-flex; align-items:center; gap:14px;
    color:var(--gold); border:1px solid var(--gold); border-radius:4px;
    padding:24px 46px; font-weight:700; font-size:21px;
    letter-spacing:3px; text-transform:uppercase;
  }
</style>
</head>
<body class="post">
  <div class="canvas">
    <div class="portrait" aria-hidden="true"><span>JS</span></div>
    <div class="stage">
      <blockquote class="headline"><span class="first">&ldquo;I&rsquo;ve watched David in the courtroom</span> — he&rsquo;s thorough, prepared, and treats every person with respect. That&rsquo;s the kind of judge we deserve.&rdquo;</blockquote>
      <p class="subhead">John Shirts</p>
      <p class="body">Idaho State Representative</p>
    </div>
    <div class="footer">
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
      <span class="cta">Join the Campaign <span aria-hidden="true">&rarr;</span></span>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>

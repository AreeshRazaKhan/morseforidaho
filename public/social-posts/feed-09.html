<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-09 · Tip / Educational</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2C3858; --navy-deep:#1F2940; --navy-ink:#141B2C;
    --burgundy:#681828; --burgundy-deep:#4A0F1B; --burgundy-light:#8B2A3E;
    --gold:#D8B868; --gold-muted:#A08838; --gold-deep:#7A6828;
    --parchment:#FAF8F2; --parchment-2:#F2ECDF; --parchment-3:#E7DFC9;
    --ink:#383028; --ink-soft:#5A5247; --ink-muted:#8A8175;
    --font-display:'EB Garamond',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background:#141B2C;display:grid;place-items:center;overflow:auto}
  body{width:1080px;height:1080px;overflow:hidden}
  body{
    position:relative; background:var(--parchment-2);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .bleed{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .watermark{
    position:absolute; right:-50px; top:-110px;
    font-family:var(--font-display); font-weight:700;
    font-size:560px; line-height:1; color:var(--parchment-3);
    user-select:none; pointer-events:none;
  }
  .canvas{
    position:relative; width:1080px; height:1080px;
    padding:96px 100px; display:flex; flex-direction:column;
  }
  .eyebrow{
    display:flex; align-items:center; gap:18px;
    font-weight:700; font-size:22px; letter-spacing:6px;
    text-transform:uppercase; color:var(--burgundy);
  }
  .eyebrow::before{content:""; width:60px; height:1px; background:var(--burgundy)}
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center}
  .kicker{
    font-family:var(--font-display); font-style:italic; font-weight:500;
    font-size:40px; color:var(--gold-deep); margin-bottom:18px;
  }
  .headline{
    font-family:var(--font-display); font-weight:700;
    font-size:92px; line-height:1.05; letter-spacing:-1px;
    color:var(--navy); max-width:760px;
  }
  .divider{width:60px; height:1px; background:var(--gold); margin:44px 0}
  .body{
    font-size:27px; line-height:1.7; color:var(--ink-soft); max-width:640px;
  }
  .body strong{font-weight:700; color:var(--ink)}
  .footer{display:flex; align-items:flex-end; justify-content:space-between}
  .cta{
    display:inline-flex; align-items:center; gap:16px;
    color:var(--navy); border:2px solid var(--navy); border-radius:4px;
    padding:26px 52px; font-weight:700; font-size:22px;
    letter-spacing:3px; text-transform:uppercase;
  }
  .logo-slot{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
  .logo-name{
    font-family:var(--font-display); font-weight:700; font-size:40px;
    letter-spacing:7px; color:var(--navy);
  }
  .logo-rule{width:112px; height:1px; background:var(--gold)}
  .logo-office{
    font-weight:700; font-size:14px; letter-spacing:4px;
    text-transform:uppercase; color:var(--ink-muted);
  }
</style>
</head>
<body class="post">
  <div class="bleed" aria-hidden="true"><div class="watermark">19</div></div>
  <div class="canvas">
    <div class="eyebrow">The Race · Nonpartisan</div>
    <div class="stage">
      <div class="kicker">Did you know?</div>
      <h1 class="headline">Every registered voter can vote for David</h1>
      <div class="divider" aria-hidden="true"></div>
      <p class="body">Judicial elections in Idaho are <strong>nonpartisan</strong>. David Morse is running on his qualifications, experience, and commitment to fairness — not a party label.</p>
    </div>
    <div class="footer">
      <span class="cta">Pledge Your Vote <span aria-hidden="true">&rarr;</span></span>
      <div class="logo-slot">
        <div class="logo-name">MORSE</div>
        <div class="logo-rule"></div>
        <div class="logo-office">For Fourth District Judge</div>
      </div>
    </div>
  </div>

<style>
  /* fit-to-viewport: scales the fixed-size post to any window or iframe */
  html{height:100%;display:block;overflow:hidden}
  body.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--post-scale,1))}
</style>
<script>
(function(){
  var fit = function(){
    var b = document.body
    document.documentElement.style.setProperty('--post-scale',
      Math.min(innerWidth / b.offsetWidth, innerHeight / b.offsetHeight, 1))
  }
  addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>
